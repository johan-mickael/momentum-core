# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Domain\:
        resource: '../src/Domain'
        exclude:
            - '../src/Domain/**/*RepositoryInterface.php'
            - '../src/Domain/**/AuthorizationServiceInterface.php'
            - '../src/Domain/**/PolicyInterface.php'
            - '../src/Domain/Common/Transaction/TransactionManagerInterface.php'

    Application\:
        resource: '../src/Application'

    Infrastructure\:
        resource: '../src/Infrastructure/'
        exclude:
            - '../src/Infrastructure/Doctrine/Migrations/*.php'
            - '../src/Infrastructure/Symfony/Kernel.php'

    UI\:
        resource: '../src/UI/'

    UI\Http\Controller\:
        resource: '../src/UI/Http/Controller/'
        tags: ['controller.service_arguments']

    UI\Http\Listener\DomainExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    UI\Http\Controller\Auth\LoginController:
        arguments:
            $jwtTokenTtl: '%lexik_jwt_authentication.token_ttl%'

    UI\Http\Controller\Auth\GoogleAuthController:
        arguments:
            $jwtTokenTtl: '%lexik_jwt_authentication.token_ttl%'
            $frontendUrl: '%env(APP_FRONTEND_URL)%'

    # Authorization Policies wiring
    Domain\Common\Security\Authorization\AuthorizationService:
        arguments:
            $policies: !tagged_iterator app.authorization_policy

    Domain\Common\Security\Authorization\AuthorizationServiceInterface:
        alias: Domain\Common\Security\Authorization\AuthorizationService

    Domain\Venue\Security\Authorization\VenuePolicy:
        tags:
            - 'app.authorization_policy'

    Domain\Event\Security\Authorization\EventPolicy:
        tags:
            - 'app.authorization_policy'

    Domain\Ticket\Security\Authorization\TicketPolicy:
        tags:
            - 'app.authorization_policy'

    Domain\Order\Security\Authorization\OrderPolicy:
        tags:
            - 'app.authorization_policy'

    # Bind domain repository interfaces to implementations
    Domain\Common\Security\PasswordHasherInterface:
        class: Infrastructure\Symfony\Security\SymfonyPasswordHasher

    Domain\User\UserRepositoryInterface:
        class: Infrastructure\Doctrine\Repository\User\DoctrineUserRepository

    Domain\Event\EventRepositoryInterface:
        class: Infrastructure\Doctrine\Repository\Event\DoctrineEventRepository

    Domain\Order\OrderRepositoryInterface:
        class: Infrastructure\Doctrine\Repository\Order\DoctrineOrderRepository

    Domain\User\TokenManagerInterface:
        class: Infrastructure\Symfony\Security\Jwt\LexikJwtTokenGenerator

    Domain\Venue\VenueRepositoryInterface:
        class: Infrastructure\Doctrine\Repository\Venue\DoctrineVenueRepository

    Domain\Ticket\TicketRepositoryInterface:
        class: Infrastructure\Doctrine\Repository\Ticket\DoctrineTicketRepository

    Domain\Common\Transaction\TransactionManagerInterface:
        class: Infrastructure\Doctrine\DoctrineTransactionManager

    Application\Common\Event\DomainEventDispatcherInterface:
        alias: Infrastructure\Symfony\Messaging\SymfonyDomainEventDispatcher

    Application\Order\EventListener\ConfirmTicketsOnOrderPaid:
        tags:
            - { name: kernel.event_listener, event: Domain\Order\Event\OrderPaid, method: __invoke }

    Application\Order\EventListener\CancelTicketsOnOrderExpired:
        tags:
            - { name: kernel.event_listener, event: Domain\Order\Event\OrderExpired, method: __invoke }

    Application\Ticket\EventListener\ReleaseTicketSlotOnTicketCancelled:
        tags:
            - { name: kernel.event_listener, event: Domain\Ticket\Event\TicketCancelled, method: __invoke }

    Application\Event\EventListener\CancelTicketsOnEventCancelled:
        tags:
            - { name: kernel.event_listener, event: Domain\Event\DomainEvent\EventCancelled, method: __invoke }

    Application\Event\EventListener\CancelOrdersOnEventCancelled:
        tags:
            - { name: kernel.event_listener, event: Domain\Event\DomainEvent\EventCancelled, method: __invoke }

    Application\Order\EventListener\CancelTicketsOnOrderCancelled:
        tags:
            - { name: kernel.event_listener, event: Domain\Order\Event\OrderCancelled, method: __invoke }

    Application\Order\EventListener\SendConfirmationEmailOnOrderPaid:
        tags:
            - { name: kernel.event_listener, event: Domain\Order\Event\OrderPaid, method: __invoke }

    Application\Auth\EventListener\SendWelcomeEmailOnUserRegistered:
        tags:
            - { name: kernel.event_listener, event: Domain\User\Event\UserRegistered, method: __invoke }

    # Notifications
    Application\Order\Service\OrderNotificationServiceInterface:
        class: Infrastructure\Symfony\Mailer\SymfonyOrderNotificationService

    # Payment — Stripe checkout
    Application\Order\Service\CheckoutServiceInterface:
        class: Infrastructure\Stripe\StripeCheckoutService
        arguments:
            $successUrl: '%env(STRIPE_CHECKOUT_SUCCESS_URL)%'
            $cancelUrl: '%env(STRIPE_CHECKOUT_CANCEL_URL)%'

    Application\Order\Service\PaymentWebhookHandlerInterface:
        class: Infrastructure\Stripe\StripePaymentWebhookHandler
        arguments:
            $webhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'

    # Clock
    Psr\Clock\ClockInterface:
        class: Symfony\Component\Clock\NativeClock

    # Handlers
    Application\Venue\CommandHandler\CreateVenueCommandHandler:
        tags:
            - { name: messenger.message_handler }

when@dev:
    services:
        UI\Http\OpenApi\OpenApiSchemaDescriber:
            tags:
                - { name: nelmio_api_doc.describer, priority: 100 }

        Infrastructure\Symfony\DataFixtures\:
            resource: '../src/Infrastructure/Symfony/DataFixtures/'
            tags: ['doctrine.fixture.orm']
            autowire: true
            autoconfigure: true

when@test:
    services:
        Tests\Fixture\:
            resource: '../tests/Fixture/'
            tags: ['doctrine.fixture.orm']
            autowire: true
            autoconfigure: true
            exclude:
                - '../tests/Fixture/Security/'
