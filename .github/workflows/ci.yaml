name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  XDEBUG_MODE: "off"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max

      - name: Install dependencies
        run: docker compose run --rm --no-deps -T php composer install --prefer-dist --no-progress --no-interaction

      - name: Start services
        run: docker compose up -d --wait

      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost

      - name: Create test database
        run: |
          docker compose exec -T php bin/console -e test doctrine:database:drop --force --if-exists
          docker compose exec -T php bin/console -e test doctrine:database:create

      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction

      - name: Create test search index
        run: docker compose exec -T php bin/console -e test app:search:events:init-index --recreate

      - name: Generate JWT keys
        run: |
          docker compose exec -T php openssl genrsa -out /app/config/jwt/private.pem 2048
          docker compose exec -T php openssl rsa -pubout -in /app/config/jwt/private.pem -out /app/config/jwt/public.pem

      - name: Run PHPUnit
        run: |
          docker compose exec -T \
            -e JWT_SECRET_KEY=/app/config/jwt/private.pem \
            -e JWT_PUBLIC_KEY=/app/config/jwt/public.pem \
            -e JWT_PASSPHRASE="" \
            php bin/phpunit

      - name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate --skip-sync
